version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: taskdb
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    container_name: auth_service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/taskdb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  task-service:
    build: ./task-service
    container_name: task_service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/taskdb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: notification_service
    ports:
      - "8003:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  presence-service:
    build: ./presence-service
    container_name: presence_service
    ports:
      - "8004:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data: